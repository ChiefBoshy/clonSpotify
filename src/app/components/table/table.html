
<h1>Tabla de objetos </h1>
<div class="w-full max-w-full overflow-x-auto rounded-lg border border-neutral-700 bg-neutral-950 shadow-lg">
  
<table class="w-full min-w-[480px] border-collapse text-sm sm:text-base">
    <thead class="bg-neutral-800 text-neutral-100">
      <tr>
        @for (column of columns(); track column.key) {
          <th
            class="whitespace-nowrap border-b border-neutral-700 px-3 py-3 text-left font-semibold sm:px-4"
          >
            {{ column.label }}
          </th>
        }
      </tr>
    </thead>

    <tbody class="divide-y divide-neutral-800">
      @for (item of data(); track $index) {
        <tr class="odd:bg-neutral-950 even:bg-neutral-900 hover:bg-neutral-800 transition-colors">
          @for (column of columns(); track column.key) {
            <td class="max-w-[240px] truncate px-3 py-3 text-neutral-300 sm:px-4">
              {{ item[column.key] }}
            </td>
          }
        </tr>
      } @empty {
        <tr>
          <td
            [attr.colspan]="columns().length"
            class="px-4 py-8 text-center text-sm text-neutral-500 sm:text-base"
          >
            No hay datos disponibles
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
