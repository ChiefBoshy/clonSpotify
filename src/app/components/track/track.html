<article
  class="group grid grid-cols-[2rem_minmax(0,1fr)_3.5rem]
         items-center gap-3 rounded-lg px-3 py-2.5
         text-gray-400 transition-colors
         hover:bg-white/10 hover:text-white
         sm:grid-cols-[2rem_minmax(0,1fr)_minmax(6rem,0.8fr)_3.5rem]
         lg:grid-cols-[2.5rem_minmax(0,1.5fr)_minmax(8rem,1fr)_4rem]"
            (click)="openTrack()"
         >
  <!-- Número de pista -->
  <div class="flex items-center justify-center">
    <span
      class="text-sm tabular-nums group-hover:hidden"
    >
      {{ index() ?? track().track_number }}
    </span>

    <span
      class="hidden text-sm text-white group-hover:inline"
      aria-hidden="true"
    >
      ♪
    </span>
  </div>

  <div class="flex min-w-0 items-center gap-3">
    @if (cover(); as imageUrl) {
      <img
        [src]="imageUrl"
        [alt]="'Portada de ' + track().album.name"
        loading="lazy"
        class="h-11 w-11 shrink-0 rounded-md
               bg-gray-800 object-cover"
      />
    } @else {
      <div
        class="flex h-11 w-11 shrink-0 items-center
               justify-center rounded-md bg-gray-800"
        aria-hidden="true"
      >
        ♪
      </div>
    }

    <div class="min-w-0">
      <a
        [href]="track().external_urls.spotify"
        target="_blank"
        rel="noopener noreferrer"
        class="block truncate text-sm font-medium
               text-gray-100 transition-colors
               hover:text-green-400"
        [title]="track().name"
      >
        {{ track().name }}
      </a>

      <div class="mt-1 flex min-w-0 items-center gap-1.5">
        @if (track().explicit) {
          <span
            class="shrink-0 rounded bg-gray-700 px-1
                   text-[10px] font-semibold text-gray-300"
            aria-label="Contenido explícito"
            title="Contenido explícito"
          >
            E
          </span>
        }

        <p
          class="truncate text-xs text-gray-400
                 group-hover:text-gray-300"
          [title]="artists()"
        >
          {{ artists() }}
        </p>
      </div>
    </div>
  </div>

  <!-- Álbum: oculto en móvil -->
  <a
    [href]="track().album.external_urls?.spotify
      ?? track().external_urls.spotify"
    target="_blank"
    rel="noopener noreferrer"
    class="hidden truncate text-sm text-gray-400
           transition-colors hover:text-white
           sm:block"
    [title]="track().album.name"
  >
    {{ track().album.name }}
  </a>

  <!-- Duración -->
  <div
    class="text-right text-sm tabular-nums
           text-gray-400"
    [attr.aria-label]="'Duración: ' + duration()"
  >
    {{ duration() }}
  </div>
</article>
